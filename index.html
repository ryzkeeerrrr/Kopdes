<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Asal Usul Kopdes</title>
<meta name="theme-color" content="#1F4D3A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kopdes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--k:#BCD6D0;--d:#FAF3DD;--t:#1B2A3A;--h:#1F4D3A;--m:#B8262E;--e:#E0A526;--f:'Abril Fatface',Rockwell,Georgia,serif;--b:'Source Serif 4',Georgia,'Times New Roman',serif}
*{box-sizing:border-box}
body{margin:0;background:var(--k) repeating-linear-gradient(45deg,rgba(255,255,255,.22) 0 6px,transparent 6px 12px);color:var(--t);font:17px/1.55 var(--b);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
main{max-width:620px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 16px 16px}
h1,h2,h3{font-family:var(--f);font-weight:400;margin:0 0 6px;line-height:1.15}
h2{font-size:24px}h3{font-size:19px}
.hd{text-align:center;padding-bottom:12px;margin-bottom:16px;border-bottom:3px double var(--t)}
.hd svg{width:84px;height:84px}
.hd h1{font-size:34px;color:var(--h);text-shadow:2px 2px 0 var(--e)}
.hd p{margin:2px 0 0;font-style:italic}
.card{background:var(--d);border:2px solid var(--t);border-radius:4px;box-shadow:4px 4px 0 var(--t);padding:12px 14px;margin:0 4px 16px 0}
.card[onclick]{cursor:pointer}
.kartu{border-style:double;border-width:6px}
.btn{display:block;width:100%;font:700 17px var(--b);background:var(--m);color:#fff;border:2px solid var(--t);border-radius:4px;box-shadow:3px 3px 0 var(--t);padding:11px;margin:10px 0;cursor:pointer}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.g{background:var(--h)}.btn.l{background:var(--d);color:var(--t)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav button:focus-visible{outline:3px solid var(--e);outline-offset:2px}
input,select,textarea{width:100%;font:17px var(--b);background:#fffaea;border:2px solid var(--t);border-radius:4px;padding:10px;margin:4px 0 12px;color:var(--t)}
label{font-weight:600;font-size:15px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.st .card{text-align:center;padding:8px 4px;margin:0 4px 6px 0;font-size:14px}
.st b{display:block;font:400 28px var(--f);color:var(--m)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--h);border-top:3px solid var(--e);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;color:#f1e6c8;font:600 14px var(--b);padding:14px 2px;cursor:pointer}
nav button.on{color:var(--e);font-weight:700;box-shadow:inset 0 -4px var(--e)}
.tag{display:inline-block;font-size:13px;font-weight:600;background:var(--h);color:#fff;border-radius:3px;padding:0 8px;margin-bottom:6px}
.ans{display:none;border-left:4px solid var(--m);padding-left:10px;margin-top:10px}
.open .ans{display:block}
#res.solo>.card:not(.open),#res.solo>.sm,#res.solo>.btn{display:none}
ol.o{margin:6px 0 0;padding-left:26px}.open li.ok{font-weight:700;color:var(--h)}
.err{color:var(--m);font-weight:600;min-height:24px}
.sm{font-size:14px;opacity:.8}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><main id="app"></main>
<nav id="nav" hidden><button data-t="home">Beranda</button><button data-t="cari">Cari</button><button data-t="kat">Kategori</button><button data-t="riw">Riwayat</button><button data-t="akun">Akun</button></nav>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbzX10qOU8WwIeAE54gF0BlIH7cj2xZXabxfMsieNCTmPlPr9qRpw8XFbjmkPB17ip-L/exec";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={g(k){try{return localStorage.getItem(k)}catch(e){return null}},s(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const F={KISI_KISI:['Kategori','Judul','Pertanyaan','Jawaban','Pembahasan','Kata_Kunci','Sumber'],MATERI:['Kategori','Judul','Isi_Materi','Kata_Kunci','Sumber'],KATEGORI:['Nama_Kategori','Deskripsi']};
let S={tok:LS.g('aot'),nama:LS.g('aon')||'',k:[],m:[],c:[],cr:[],ri:[],tab:'home',cat:'',q:'',jn:'k',n:30,adm:'',at:'KISI_KISI',sync:'',mode:'in'},L=null;
const LOGO=`<svg viewBox='0 0 100 100' role='img' aria-label='Lebah besar bersama burung kecil'><circle cx='50' cy='50' r='47' fill='#FAF3DD' stroke='#1B2A3A' stroke-width='3'/><circle cx='50' cy='50' r='41' fill='none' stroke='#B8262E' stroke-width='1.6' stroke-dasharray='2 3'/><g transform='translate(47 60) rotate(-10)'>
<ellipse cx='-3' cy='-18' rx='11' ry='8' fill='#FAF3DD' stroke='#1B2A3A' stroke-width='2' transform='rotate(-25 -3 -18)'/>
<ellipse cx='9' cy='-17' rx='10' ry='7' fill='#FAF3DD' stroke='#1B2A3A' stroke-width='2' transform='rotate(15 9 -17)'/>
<path d='M-22 -4L-31 0L-22 4Z' fill='#1B2A3A'/>
<ellipse rx='23' ry='15' fill='#E0A526' stroke='#1B2A3A' stroke-width='2.6'/>
<rect x='-12' y='-12' width='5' height='24' fill='#1B2A3A'/><rect x='-3' y='-13' width='5' height='26' fill='#1B2A3A'/><rect x='6' y='-12' width='5' height='24' fill='#1B2A3A'/>
<ellipse rx='23' ry='15' fill='none' stroke='#1B2A3A' stroke-width='2.6'/>
<circle cx='25' cy='1' r='9' fill='#1B2A3A'/><circle cx='28' cy='-2' r='2.2' fill='#FAF3DD'/><circle cx='28' cy='5' r='1.6' fill='#FAF3DD'/>
<path d='M28 -6C32 -12 35 -13 38 -12M30 -4C36 -8 40 -7 42 -5' fill='none' stroke='#1B2A3A' stroke-width='1.6' stroke-linecap='round'/>
</g>
<g transform='translate(57 9) scale(.36)'><path d='M24 60L10 70L32 64Z' fill='#1F4D3A' stroke='#1B2A3A' stroke-width='1.5'/><path d='M22 58C32 48 48 47 60 53C66 56 72 55 77 51L73 60C66 66 54 68 44 65C36 64 28 62 22 58Z' fill='#1F4D3A' stroke='#1B2A3A' stroke-width='2'/><path d='M46 53C41 37 49 25 64 20C60 32 60 43 60 54Z' fill='#B8262E' stroke='#1B2A3A' stroke-width='2'/><path d='M44 56C34 46 24 44 16 46C26 52 34 58 44 60Z' fill='#E0A526' stroke='#1B2A3A' stroke-width='2'/><path d='M77 51L89 53L77 56Z' fill='#E0A526' stroke='#1B2A3A' stroke-width='1.5'/><circle cx='69' cy='54' r='1.8' fill='#FAF3DD'/></g></svg>`;
const hd=()=>`<div class="hd">${LOGO}<h1>Asal Usul Kopdes</h1><p>Arsip pengetahuan koperasi desa</p></div>`;
async function api(b){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)}),j=await r.json();if(j.auth&&S.tok){keluar();throw new Error('auth')}return j}
function keluar(){S.tok=null;S.k=[];S.m=[];S.adm='';LS.s('aot');LS.s('aon');S.mode='in';auth()}
function auth(){
 const up=S.mode==='up';$('#nav').hidden=true;
 $('#app').innerHTML=hd()+`<form class="card kartu" onsubmit="go();return false"><h2>${up?'Daftar anggota':'Masuk'}</h2>
 <label for="nik">NIK (8 angka)</label><input id="nik" inputmode="numeric" maxlength="8" autocomplete="username">
 ${up?'<label for="nm">Nama lengkap</label><input id="nm" maxlength="60" autocomplete="name">':''}
 <label for="pin">PIN (6 angka)</label><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="${up?'new-password':'current-password'}">
 ${up?'<label for="pin2">Ulangi PIN</label><input id="pin2" type="password" inputmode="numeric" maxlength="6"><label for="kd">Kode pendaftaran (jika ada)</label><input id="kd" maxlength="40">':''}
 <div class="err" id="er"></div><button class="btn" id="gb">${up?'Daftar':'Masuk'}</button>
 <button type="button" class="btn l" onclick="S.mode='${up?'in':'up'}';auth()">${up?'Sudah punya akun? Masuk':'Belum punya akun? Daftar'}</button></form>`}
async function go(){
 const v=i=>($('#'+i)||{}).value||'',up=S.mode==='up',er=$('#er'),bad=m=>{er.textContent=m};
 if(!/^\d{8}$/.test(v('nik')))return bad('NIK harus 8 angka');
 if(!/^\d{6}$/.test(v('pin')))return bad('PIN harus 6 angka');
 if(up){if(v('nm').trim().length<2)return bad('Nama wajib diisi');if(v('pin')!==v('pin2'))return bad('PIN tidak sama')}
 $('#gb').disabled=true;bad('Memproses…');
 try{const j=await api({action:up?'register':'login',nik:v('nik'),pin:v('pin'),nama:v('nm'),kode:v('kd')});
  if(!j.ok){bad(j.error);$('#gb').disabled=false;return}
  S.tok=j.token;S.nama=j.nama;S.tab='home';LS.s('aot',j.token);LS.s('aon',j.nama);await load()}
 catch(e){bad('Gagal terhubung ke server. Periksa sinyal Anda.');$('#gb').disabled=false}}
async function load(){
 S.sync='Memuat soal…';R();
 try{const j=await api({action:'data',token:S.tok});if(!j.ok)throw 0;
  const ob=t=>t.r.map(r=>{const o={};t.h.forEach((h,i)=>o[h]=r[i]);o._s=[o.Judul,o.Pertanyaan,o.Isi_Materi,o.Jawaban,o.Kata_Kunci,o.Kategori].join(' ').toLowerCase();return o});
  S.k=ob(j.data.KISI_KISI);S.m=ob(j.data.MATERI);S.cr=j.data.KATEGORI.r.map(r=>({ID:r[0],Nama_Kategori:r[1]}));S.c=S.cr.map(o=>o.Nama_Kategori);S.ri=j.riwayat||[];
  S.sync='Terhubung, sinkron '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}
 catch(e){S.sync='Gagal memuat. Ketuk Sinkronkan di Akun.'}
 R()}
function qh(q){const i=q.indexOf(': ');let st=q,op=[];if(i>0&&q.indexOf(';',i)>0){st=q.slice(0,i);op=q.slice(i+2).split(/;\s*/)}return esc(st)+(op.length?'<ol class="o" type="A">'+op.map(x=>`<li>${esc(x)}</li>`).join('')+'</ol>':'')}
function qo(q,a){const h=qh(q),A=esc(String(a).trim().toLowerCase());return h.replace(/<li>(.*?)<\/li>/g,(m,x)=>x.trim().toLowerCase()===A?`<li class="ok">${x}</li>`:m)}
const jw=o=>`<div class="ans"><b>Jawaban:</b> ${esc(o.Jawaban)}${o.Pembahasan?'<br><i>'+esc(o.Pembahasan)+'</i>':''}</div>`;
function hit(e){e.classList.toggle('open');const r=e.closest('#res');if(r){const on=!!r.querySelector('.card.open');r.classList.toggle('solo',on);if(on){S.q='';const q=$('#q');if(q)q.value=''}}}
const item=o=>`<div class="card" onclick="hit(this)"><span class="tag">${esc(o.Kategori)}</span><div>${qo(o.Pertanyaan,o.Jawaban)}</div>${jw(o)}<div class="sm">${esc(o.Sumber)} · ketuk untuk lihat jawaban</div></div>`;
const mat=o=>`<div class="card"><span class="tag">${esc(o.Kategori)}</span><h3>${esc(o.Judul)}</h3><div style="white-space:pre-wrap">${esc(o.Isi_Materi)}</div><div class="sm">${esc(o.Sumber)}</div></div>`;
const num=n=>n.toLocaleString('id-ID');
const home=()=>`<h2>Halo, ${esc(S.nama.split(' ')[0])}!</h2><p>Mau cari jawaban kehidupan apa hari ini?</p>
<div class="st"><div class="card"><b>${num(S.k.length)}</b>Kisi-kisi</div><div class="card"><b>${num(S.m.length)}</b>Materi</div><div class="card"><b>${num(S.c.length)}</b>Kategori</div></div>
<div class="sm">${esc(S.sync)}</div><button class="btn" onclick="S.tab='lat';L=null;R()">Mulai mode latihan</button>
<h2>Terbaru</h2>${S.k.slice(-5).reverse().map(item).join('')||'<div class="card">Belum ada soal. Admin dapat menambahkannya lewat menu Akun.</div>'}`;
function cari(){const sel=(a,b)=>a===b?' selected':'';return `<input id="q" placeholder="Cari soal & materi…" value="${esc(S.q)}" oninput="S.q=this.value;S.n=30;clearTimeout(S.t);S.t=setTimeout(res,200)">
<select aria-label="Jenis" onchange="S.jn=this.value;S.n=30;res()"><option value="k"${sel(S.jn,'k')}>Kisi-kisi</option><option value="m"${sel(S.jn,'m')}>Materi</option></select>
<select aria-label="Kategori" onchange="S.cat=this.value;S.n=30;res()"><option value="">Semua kategori</option>${S.c.map(c=>`<option${sel(c,S.cat)}>${esc(c)}</option>`).join('')}</select><div id="res"></div>`}
function res(){const w=S.q.toLowerCase().split(/\s+/).filter(Boolean),r=(S.jn==='k'?S.k:S.m).filter(o=>(!S.cat||o.Kategori===S.cat)&&w.every(x=>o._s.includes(x)));
 $('#res').classList.remove('solo');
 $('#res').innerHTML=`<div class="sm">${num(r.length)} hasil</div>`+(r.slice(0,S.n).map(S.jn==='k'?item:mat).join('')||'<div class="card">Mikir sendiri wkwkwk</div>')+(r.length>S.n?'<button class="btn l" onclick="S.n+=30;res()">Muat lagi</button>':'')}
function kat(){const n={};S.k.forEach(o=>n[o.Kategori]=(n[o.Kategori]||0)+1);return '<h2>Kategori</h2>'+(S.c.map((c,i)=>`<div class="card" onclick="pil(${i})"><h3>${esc(c)}</h3><div class="sm">${num(n[c]||0)} soal</div></div>`).join('')||'<div class="card">Belum ada kategori.</div>')}
function pil(i){S.cat=S.c[i];S.jn='k';S.q='';S.n=30;S.tab='cari';R()}
function lat(){
 if(!L)return `<div class="card"><h2>Mode latihan</h2><p>10 soal acak. Jawab dalam hati, lalu cek jawabannya.</p><label for="lc">Kategori</label><select id="lc"><option value="">Semua kategori</option>${S.c.map(c=>`<option>${esc(c)}</option>`).join('')}</select><button class="btn" onclick="mulai()">Mulai latihan</button></div>`;
 if(L.done)return `<div class="card"><h2>Latihan selesai</h2><p>Anda paham ${L.b} dari ${L.qs.length} soal.</p><button class="btn" onclick="L=null;R()">Latihan lagi</button><button class="btn l" onclick="S.tab='riw';L=null;R()">Lihat riwayat</button></div>`;
 const o=L.qs[L.i];
 return `<div class="card${L.show?' open':''}"><div class="sm">Soal ${L.i+1} dari ${L.qs.length} · ${esc(o.Kategori)}</div><p>${qo(o.Pertanyaan,o.Jawaban)}</p>${jw(o)}${L.show?'<button class="btn g" onclick="nx(1)">Sudah paham</button><button class="btn" onclick="nx(0)">Belum paham</button>':'<button class="btn" onclick="L.show=1;R()">Lihat jawaban</button>'}</div>`}
function mulai(){const c=$('#lc').value,p=S.k.filter(o=>!c||o.Kategori===c);if(!p.length){alert('Belum ada soal di kategori ini.');return}
 L={qs:p.sort(()=>Math.random()-.5).slice(0,10),i:0,b:0,cat:c||'Semua',show:0};R()}
function nx(ok){L.b+=ok;L.i++;L.show=0;
 if(L.i>=L.qs.length){L.done=1;S.ri.unshift([new Date().toISOString().slice(0,10),L.cat,L.qs.length,L.b]);api({action:'riwayat_add',token:S.tok,kategori:L.cat,jumlah:L.qs.length,benar:L.b}).catch(()=>{})}
 R()}
function riw(){const t=S.ri.reduce((a,r)=>[a[0]+(+r[2]),a[1]+(+r[3])],[0,0]);
 return `<h2>Riwayat latihan</h2><div class="card"><b>${S.ri.length}</b> sesi, ${t[0]} soal dijawab, ${t[1]} paham (${t[0]?Math.round(t[1]/t[0]*100):0}%)</div>`+(S.ri.slice(0,30).map(r=>`<div class="card">${esc(r[0])} · ${esc(r[1])}<br>Paham ${esc(r[3])} dari ${esc(r[2])} soal</div>`).join('')||'<div class="card">Belum ada latihan. Mulai dari menu Beranda.</div>')}
function akun(){
 let h=`<div class="card"><h2>${esc(S.nama)}</h2><div class="sm">${esc(S.sync)}</div><button class="btn g" onclick="load()">Sinkronkan</button><button class="btn l" onclick="keluar()">Keluar</button></div>`;
 if(!S.adm)return h+`<div class="card"><h3>Admin</h3><label for="ak">Kunci admin</label><input id="ak" type="password"><div class="err" id="ae"></div><button class="btn" onclick="adm()">Masuk admin</button></div>`;
 const src=S.at==='KISI_KISI'?S.k:S.at==='MATERI'?S.m:S.cr;
 return h+`<div class="card"><h3>Kelola data</h3><select aria-label="Tabel" onchange="S.at=this.value;R()">${Object.keys(F).map(t=>`<option value="${t}"${t===S.at?' selected':''}>${t.replace('_','-')}</option>`).join('')}</select>
 ${F[S.at].map(x=>`<label for="f_${x}">${x.replace('_',' ')}</label>`+(/Pertanyaan|Isi_|Pembahasan|Deskripsi/.test(x)?`<textarea id="f_${x}" rows="3"></textarea>`:`<input id="f_${x}"${x==='Kategori'?' list="dl"':''}>`)).join('')}
 <datalist id="dl">${S.c.map(c=>`<option value="${esc(c)}">`).join('')}</datalist><div class="err" id="ae"></div><button class="btn" onclick="tmb()">Tambah</button></div>
 <h3>Terakhir ditambahkan</h3>`+src.slice(-8).reverse().map(o=>`<div class="card"><div class="sm">${esc(o.Kategori||'')}</div>${esc((o.Judul||o.Nama_Kategori||'').slice(0,90))}<button class="btn l" onclick="del('${o.ID}')">Hapus</button></div>`).join('')}
async function adm(){const k=$('#ak').value;try{const j=await api({action:'check',token:S.tok,key:k});if(!j.ok){$('#ae').textContent=j.error;return}S.adm=k;R()}catch(e){$('#ae').textContent='Gagal terhubung ke server'}}
async function tmb(){const rec={},er=$('#ae');F[S.at].forEach(x=>rec[x]=($('#f_'+x)||{}).value||'');
 if(!(rec.Judul||rec.Nama_Kategori)){er.textContent='Judul atau nama wajib diisi';return}
 try{const j=await api({action:'add',token:S.tok,key:S.adm,table:S.at,record:rec});if(!j.ok){er.textContent=j.error;return}await load()}catch(e){er.textContent='Gagal terhubung ke server'}}
async function del(id){if(!confirm('Hapus data ini?'))return;try{const j=await api({action:'remove',token:S.tok,key:S.adm,table:S.at,id:id});if(!j.ok){alert(j.error);return}await load()}catch(e){alert('Gagal terhubung ke server')}}
function R(){
 if(!S.tok)return auth();
 $('#nav').hidden=false;$('#app').innerHTML=hd()+({home,cari,kat,riw,akun,lat}[S.tab]||home)();
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab||(S.tab==='lat'&&b.dataset.t==='home')));
 if(S.tab==='cari')res()}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;L=null;R()});
if(S.tok){R();load()}else auth();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
